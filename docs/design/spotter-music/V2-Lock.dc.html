<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>V2 Glass · Lock screen Live Activity</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
            font-family: 'Inter', system-ui, sans-serif;
            background: #0f1012;
            color: #e9eaec;
          }
          * {
            box-sizing: border-box;
          }
          button {
            font: inherit;
            color: inherit;
            background: none;
            border: 0;
            padding: 0;
            cursor: pointer;
          }
          .lbl {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #b0b4b8;
          }
          .num {
            font-variant-numeric: tabular-nums;
          }
          .glass {
            background: linear-gradient(180deg, rgba(60, 48, 30, 0.42), rgba(20, 18, 14, 0.62));
            box-shadow:
              inset 0 1.2px 0.5px rgba(238, 211, 165, 0.45),
              inset 0 0 0 1px rgba(217, 162, 79, 0.26);
          }
          .pill {
            height: 44px;
            border-radius: 22px;
            background: rgba(233, 234, 236, 0.08);
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          position: relative;
          overflow: hidden;
          background:
            radial-gradient(90% 50% at 70% 30%, rgba(138, 100, 46, 0.5), transparent 70%),
            radial-gradient(80% 40% at 20% 70%, rgba(43, 31, 58, 0.8), transparent 70%), #0b0b0d;
          display: flex;
          flex-direction: column;
          align-items: center;
          padding: 70px 12px 28px;
        "
      >
        <div style="font-size: 17px; font-weight: 500; color: #d0d3d6">Monday 28 September</div>
        <div
          class="num"
          style="
            font-size: 86px;
            font-weight: 300;
            letter-spacing: -0.03em;
            line-height: 1;
            margin-top: 4px;
          "
        >
          18:42
        </div>
        <div
          style="margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 10px"
        >
          <div
            style="
              width: 100%;
              border-radius: 22px;
              background: rgba(40, 42, 46, 0.6);
              padding: 12px 16px;
              display: flex;
              align-items: center;
              gap: 12px;
            "
          >
            <div
              style="
                width: 40px;
                height: 40px;
                border-radius: 8px;
                background: linear-gradient(135deg, #2b1f3a, #8a642e 55%, #eed3a5);
              "
            ></div>
            <div style="flex: 1">
              <div style="font-size: 14px; font-weight: 600">Houdini</div>
              <div style="font-size: 13px; color: #b0b4b8">Dua Lipa</div>
            </div>
            <span class="lbl">Music</span>
          </div>
          <div
            class="glass"
            style="
              width: 100%;
              border-radius: 26px;
              padding: 16px;
              display: flex;
              flex-direction: column;
              gap: 14px;
            "
          >
            <div style="display: flex; align-items: center; gap: 14px">
              <div
                style="
                  width: 84px;
                  height: 84px;
                  border-radius: 42px;
                  border: 5px solid rgba(233, 234, 236, 0.12);
                  border-top-color: #eed3a5;
                  border-right-color: #eed3a5;
                  display: flex;
                  flex-direction: column;
                  align-items: center;
                  justify-content: center;
                "
              >
                <span class="num" style="font-size: 22px; font-weight: 600">1:12</span
                ><span class="lbl" style="font-size: 9px; color: #eed3a5">rest</span>
              </div>
              <div style="flex: 1">
                <div class="lbl" style="color: #eed3a5">Chest 2 · Set 4 of 4</div>
                <div style="font-size: 18px; font-weight: 600; margin-top: 4px">Bench press</div>
                <div class="num" style="font-size: 15px; color: #d0d3d6">100 kg × 5</div>
              </div>
            </div>
            <div style="display: flex; gap: 8px">
              <button class="pill">+15 s</button>
              <button
                class="pill"
                style="
                  flex: 1.6;
                  background: rgba(217, 162, 79, 0.18);
                  box-shadow: inset 0 0 0 1px rgba(217, 162, 79, 0.6);
                  color: #eed3a5;
                  font-weight: 600;
                "
              >
                Set done
              </button>
            </div>
          </div>
        </div>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
      class Component extends DCLogic {
      renderVals() { return {}; }
      }
    </script>
  </body>
</html>
