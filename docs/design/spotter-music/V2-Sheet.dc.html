            background: #0f1012;

            color: inherit;
            background: none;
            border: 0;
            padding: 0;
            cursor: pointer;

            font-weight: 600;

            text-transform: uppercase;
            color: #b0b4b8;

            background: linear-gradient(180deg, rgba(60, 48, 30, 0.34), rgba(20, 18, 14, 0.5));

              inset 0 1.2px 0.5px rgba(238, 211, 165, 0.45),
              inset 0 0 0 1px rgba(217, 162, 79, 0.26);
          }
          .soft {
            background: rgba(10, 10, 12, 0.32);

          }

            width: 56px;
            height: 56px;
            border-radius: 28px;

            align-items: center;
            justify-content: center;
            color: #e9eaec;
