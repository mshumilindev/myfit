<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>V2 Glass · Session with mini-player</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
            font-family: 'Inter', system-ui, sans-serif;
            background: #0f1012;
            color: #e9eaec;
          }
          * {
            box-sizing: border-box;
          }
          button {
            font: inherit;
            color: inherit;
            background: none;
            border: 0;
            padding: 0;
            cursor: pointer;
          }
          .lbl {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #90959a;
          }
          .num {
            font-variant-numeric: tabular-nums;
          }
          .glass {
            background: linear-gradient(180deg, rgba(60, 48, 30, 0.38), rgba(20, 18, 14, 0.55));
            box-shadow:
              inset 0 1.2px 0.5px rgba(238, 211, 165, 0.45),
              inset 0 0 0 1px rgba(217, 162, 79, 0.26);
            backdrop-filter: blur(18px);
          }
          .pane {
            background: rgba(31, 33, 37, 0.72);
            border: 1px solid rgba(233, 234, 236, 0.07);
            border-radius: 18px;
          }
          .set {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 40px;
            padding: 0 12px;
            border-radius: 12px;
            background: rgba(233, 234, 236, 0.04);
            font-size: 15px;
          }
          .ib {
            width: 44px;
            height: 44px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e9eaec;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          background:
            radial-gradient(90% 40% at 80% 100%, rgba(138, 100, 46, 0.45), transparent 70%),
            radial-gradient(70% 30% at 10% 95%, rgba(43, 31, 58, 0.7), transparent 70%), #121316;
          position: relative;
          overflow: hidden;
        "
      >
        <div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px">
          <div
            class="glass"
            style="
              height: 48px;
              border-radius: 24px;
              display: flex;
              align-items: center;
              justify-content: space-between;
              padding: 0 16px;
            "
          >
            <div style="display: flex; align-items: center; gap: 8px">
              <span style="width: 7px; height: 7px; border-radius: 4px; background: #d9a24f"></span
              ><span class="lbl" style="color: #eed3a5">Live · Chest 2</span>
            </div>
            <span class="num" style="font-size: 16px; font-weight: 600">42:18</span>
          </div>
          <div class="pane" style="padding: 16px; display: flex; flex-direction: column; gap: 8px">
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                margin-bottom: 4px;
              "
            >
              <span style="font-size: 20px; font-weight: 600">Bench press</span
              ><span class="lbl">4 of 4</span>
            </div>
            <div class="set num">
              <span>90 kg × 8</span><span style="color: #4cbe8c; font-size: 13px">done</span>
            </div>
            <div class="set num">
              <span>95 kg × 6</span><span style="color: #4cbe8c; font-size: 13px">done</span>
            </div>
            <div class="set num">
              <span>97.5 kg × 5</span><span style="color: #4cbe8c; font-size: 13px">done</span>
            </div>
            <div class="glass set num" style="height: 52px; border-radius: 14px">
              <span style="color: #eed3a5">100 kg × 5</span
              ><button
                style="
                  height: 36px;
                  padding: 0 18px;
                  border-radius: 18px;
                  border: 1px solid #d9a24f;
                  color: #eed3a5;
                  font-weight: 600;
                  font-size: 14px;
                "
              >
                Log
              </button>
            </div>
          </div>
          <div
            class="glass"
            style="
              border-radius: 18px;
              padding: 14px 16px;
              display: flex;
              align-items: center;
              gap: 14px;
            "
          >
            <div
              style="
                width: 52px;
                height: 52px;
                border-radius: 26px;
                border: 3px solid rgba(233, 234, 236, 0.12);
                border-top-color: #d9a24f;
                border-right-color: #d9a24f;
                display: flex;
                align-items: center;
                justify-content: center;
              "
            >
              <span class="num" style="font-size: 13px; font-weight: 600">1:12</span>
            </div>
            <div style="flex: 1">
              <div class="lbl" style="color: #eed3a5">Rest</div>
              <div style="font-size: 14px; margin-top: 2px">Next: 100 kg × 5</div>
            </div>
            <button style="font-size: 13px; color: #eed3a5; height: 36px">+15 s</button>
          </div>
          <div
            class="pane"
            style="padding: 14px 16px; display: flex; align-items: center; gap: 12px"
          >
            <div
              style="
                width: 34px;
                height: 34px;
                border-radius: 17px;
                background: linear-gradient(135deg, #2b1f3a, #8a642e 55%, #eed3a5);
              "
            ></div>
            <div style="flex: 1; font-size: 13px; color: #b0b4b8">
              At 100 kg last time you had <span style="color: #e9eaec">Training Season</span> on
            </div>
            <button style="font-size: 13px; font-weight: 600; color: #d9a24f; height: 36px">
              Play
            </button>
          </div>
        </div>
        <div
          class="glass"
          style="
            position: absolute;
            left: 16px;
            right: 16px;
            bottom: 84px;
            height: 64px;
            border-radius: 32px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 8px;
          "
        >
          <div
            style="
              width: 48px;
              height: 48px;
              border-radius: 24px;
              background: linear-gradient(135deg, #2b1f3a, #8a642e 55%, #eed3a5);
              box-shadow: 0 0 0 2px rgba(217, 162, 79, 0.5);
            "
          ></div>
          <div style="flex: 1">
            <div style="font-size: 15px; font-weight: 600">Houdini</div>
            <div style="font-size: 12px; color: #d0d3d6">Dua Lipa</div>
          </div>
          <button class="ib" aria-label="Pause">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"></path>
            </svg>
          </button>
          <button class="ib" aria-label="Next track">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 5v14l9-7zM16 5h2.5v14H16z"></path>
            </svg>
          </button>
        </div>
        <div
          style="
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 70px;
            background: rgba(18, 19, 22, 0.86);
            border-top: 1px solid rgba(233, 234, 236, 0.07);
            display: flex;
            align-items: center;
            justify-content: space-around;
          "
        >
          <button class="ib" aria-label="Today" style="color: #d9a24f">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <rect x="4" y="5" width="16" height="15" rx="2"></rect>
              <path d="M4 10h16M9 3v4M15 3v4"></path>
            </svg>
          </button>
          <button class="ib" aria-label="Plan" style="color: #90959a">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path d="M5 7h14M5 12h14M5 17h9"></path>
            </svg>
          </button>
          <button
            class="glass"
            aria-label="Start"
            style="
              width: 52px;
              height: 52px;
              border-radius: 26px;
              color: #eed3a5;
              display: flex;
              align-items: center;
              justify-content: center;
            "
          >
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M12 5v14M5 12h14"></path>
            </svg>
          </button>
          <button class="ib" aria-label="Progress" style="color: #90959a">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path d="M4 19l5-6 4 3 7-9"></path>
            </svg>
          </button>
          <button class="ib" aria-label="Me" style="color: #90959a">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 20c1.5-4 5-5 8-5s6.5 1 8 5"></path>
            </svg>
          </button>
        </div>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
      class Component extends DCLogic {
      renderVals() { return {}; }
      }
    </script>
  </body>
</html>
