<title>Progress</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one calm column; one card per task, the block strip is the hero. */
:root{--bg:#f4f5f7;--surface:#ffffff;--fg:#1b1e24;--mut:#5d6675;--line:#dde1e7;--done:#1f8a55;--doing:#2a63d6;--blocked:#c93a33;--skipped:#b87d0c;--todo:#c3c9d2;--font:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101216;--surface:#171a20;--fg:#e8eaed;--mut:#9aa0aa;--line:#262b34;--done:#3fb97a;--doing:#4c8dff;--blocked:#e5534b;--skipped:#e0a63a;--todo:#3a404b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101216;--surface:#171a20;--fg:#e8eaed;--mut:#9aa0aa;--line:#262b34;--done:#3fb97a;--doing:#4c8dff;--blocked:#e5534b;--skipped:#e0a63a;--todo:#3a404b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.live{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--todo)}
.live.ok .dot{background:var(--done)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.parked{opacity:.8}
.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.tid{font-family:var(--mono);font-weight:600;font-size:15px}
.pct{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sub{color:var(--mut);font-variant-numeric:tabular-nums}
.eta{margin-left:auto;color:var(--mut);font-size:12px}
.strip{display:flex;flex-wrap:wrap;gap:4px}
.b{width:16px;height:16px;border-radius:3px;border:0;padding:0;background:var(--todo);cursor:default}
.b.done{background:var(--done)}.b.doing{background:var(--doing);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--doing)}
.b.blocked{background:var(--blocked)}.b.skipped{background:var(--skipped)}
.b:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--mut)}
.chip{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.chip i{width:10px;height:10px;border-radius:2px;display:block}
.now{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now b{color:var(--doing);font-weight:600}
.empty{text-align:center;color:var(--mut);padding:32px 16px}
#tip{position:fixed;z-index:20;max-width:320px;background:var(--fg);color:var(--bg);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.4;pointer-events:none;display:none}
#tip b{display:block;font-family:var(--mono);margin-bottom:2px}
#tip .why{margin-top:4px;opacity:.85}
</style>
<main>
<header><h1>Progress</h1><div class="live" id="live"><span class="dot"></span><span id="liveText">Connecting…</span></div></header>
<div id="root"><div class="card empty">No task yet</div></div>
</main>
<div id="tip" role="tooltip"></div>
<script>
(function(){
  var NAMES={done:'Done',doing:'In progress',blocked:'Blocked',skipped:'Skipped',todo:'To do'};
  var ORDER=['done','doing','blocked','skipped','todo'];
  var root=document.getElementById('root'),tip=document.getElementById('tip');
  var live=document.getElementById('live'),liveText=document.getElementById('liveText');
  var last=0;
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function showTip(b,anchor){
    tip.textContent='';
    var h=el('b',null,b.id+' · '+(NAMES[b.status]||'To do'));tip.appendChild(h);
    tip.appendChild(el('div',null,b.text||'No description'));
    if((b.status==='blocked'||b.status==='skipped'))tip.appendChild(el('div','why',b.why||'No reason recorded'));
    tip.style.display='block';
    var r=anchor.getBoundingClientRect(),w=tip.offsetWidth,hh=tip.offsetHeight;
    var x=Math.min(Math.max(8,r.left),window.innerWidth-w-8);
    var y=r.top-hh-8;if(y<8)y=r.bottom+8;
    tip.style.left=x+'px';tip.style.top=y+'px';
  }
  function hideTip(){tip.style.display='none'}
  function render(d){
    root.textContent='';
    var tasks=(d&&d.tasks)||[];
    if(!tasks.length){root.appendChild(el('div','card empty','No task yet'));return}
    tasks.forEach(function(t){
      var c=el('section','card'+(t.active?'':' parked'));
      var top=el('div','top');
      top.appendChild(el('span','tid',t.task));
      top.appendChild(el('span','pct',t.pct+'%'));
      top.appendChild(el('span','sub',t.done+'/'+t.total+' done'));
      if(t.eta)top.appendChild(el('span','eta',t.eta));
      c.appendChild(top);
      var strip=el('div','strip');
      (t.blocks||[]).forEach(function(b){
        var s=el('button','b '+(NAMES[b.status]?b.status:'todo'));
        s.type='button';s.setAttribute('aria-label',b.id+' '+(NAMES[b.status]||'To do'));
        s.addEventListener('mouseenter',function(){showTip(b,s)});
        s.addEventListener('mouseleave',hideTip);
        s.addEventListener('focus',function(){showTip(b,s)});
        s.addEventListener('blur',hideTip);
        s.addEventListener('click',function(){showTip(b,s)});
        strip.appendChild(s);
      });
      c.appendChild(strip);
      var chips=el('div','chips');
      ORDER.forEach(function(k){
        var n=k==='todo'?t.todo:t[k];
        if(!n)return;
        var ch=el('span','chip');var sw=el('i');sw.style.background='var(--'+k+')';
        ch.appendChild(sw);ch.appendChild(document.createTextNode(n+' '+NAMES[k]));chips.appendChild(ch);
      });
      c.appendChild(chips);
      if(t.active){
        var now=el('div','now');
        if(t.now){now.appendChild(el('b',null,'Now: '));now.appendChild(document.createTextNode(t.now))}
        else now.textContent=t.pct===100?'All done':'Idle';
        c.appendChild(now);
      }
      root.appendChild(c);
    });
  }
  function tick(){
    if(!last){return}
    var s=Math.max(0,Math.round((Date.now()-last)/1000));
    liveText.textContent='Updated '+(s<60?s+' s':Math.round(s/60)+' min')+' ago';
  }
  setInterval(tick,1000);
  window.addEventListener('scroll',hideTip,{passive:true});
  claude.use('db').then(function(db){
    if(!db){liveText.textContent='Live data unavailable';return}
    db.doc('wf/state').onSnapshot(function(snap){
      if(!snap.exists){render(null);liveText.textContent='Waiting for first update';return}
      var d=snap.data();render(d);last=d.updatedAt||Date.now();live.className='live ok';tick();
    },function(){live.className='live';liveText.textContent='Disconnected'});
  });
})();
</script>
