<!doctype html>
<html lang="uk" class="theme-glass">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#16171a" />
    <meta name="description" content="Everything you lift, in one place." />
    <meta name="application-name" content="Spotter" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Not black-translucent: iOS then sizes the standalone window to
         "screen − status bar" but still draws it from the top, leaving that
         height as a dead band under the tab bar (measured 62px on a 956px
         screen). Opaque status bar = window starts below it and reaches the
         bottom edge. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Spotter" />
    <meta name="format-detection" content="telephone=no" />
    <meta property="og:title" content="Spotter" />
    <meta property="og:image" content="/brand/v2/icon-512.png" />
    <link rel="icon" href="/favicon/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/v2/apple-touch-180.png" />
    <link rel="apple-touch-icon" href="/brand/v2/apple-touch-180.png" />
    <link rel="apple-touch-icon-precomposed" href="/brand/v2/apple-touch-precomposed.png" />
    <!-- Brand wordmark font (header "spotter · gym") and the landing fonts. Loads at runtime; falls
         back to system fonts offline. They used to be a CSS @import in landing-design.css, which holds the first
         paint until Google answers (SPO-14). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking: a normal stylesheet link would hold the first paint until
         Google answers, which on a dead or very slow network is "never". The
         media swap loads it in the background; font-display: swap does the rest. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700&amp;family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;700&amp;family=Kaushan+Script&amp;display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700&amp;family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;700&amp;family=Kaushan+Script&amp;display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Spotter</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Blank-screen watchdog. A home-screen app can be left with a worker whose cached shell no longer matches the
         files on the server (the page then never mounts and shows nothing, so no in-app recovery can run). If the app
         has not drawn anything after 20 s, drop every worker and cache and load fresh from the network, once a
         minute at most. Plain script on purpose: it must run when the app bundle does not. -->
    <script>
      (function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          try {
            var last = Number(sessionStorage.getItem('spotter.blankRecovery') || 0);
            if (Date.now() - last < 60000) return;
            sessionStorage.setItem('spotter.blankRecovery', String(Date.now()));
          } catch (e) {}
          var done = function () {
            location.reload();
          };
          var regs = navigator.serviceWorker
            ? navigator.serviceWorker.getRegistrations().then(function (list) {
                return Promise.all(
                  list.map(function (r) {
                    return r.unregister();
                  }),
                );
              })
            : Promise.resolve();
          var wipe = window.caches
            ? caches.keys().then(function (keys) {
                return Promise.all(
                  keys.map(function (k) {
                    return caches.delete(k);
                  }),
                );
              })
            : Promise.resolve();
          Promise.all([regs, wipe]).then(done, done);
        }, 20000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
