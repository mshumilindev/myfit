name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Full five-locale layout audit every night and on demand (Actions -> CI -> Run workflow).
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

# A newer push to the same PR cancels the older run (saves minutes); main is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  # Layout audit is split into parallel shards (SPO-140); the merge job proves they add up to the full matrix.
  # A PR audits English only (fast); main, the nightly run and a manual run audit all five locales.
  LAYOUT_LOCALES: ${{ github.event_name == 'pull_request' && 'en' || 'en,uk,pl,lt,et' }}
  LAYOUT_SHARDS: ${{ github.event_name == 'pull_request' && '12' || '20' }}

jobs:
  # ---- quality: five independent jobs instead of one 4.5-minute chain; `quality` below keeps the old check name ----
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/eslint
          key: eslint-${{ hashFiles('package-lock.json', 'eslint.config.*') }}-${{ github.sha }}
          restore-keys: eslint-${{ hashFiles('package-lock.json', 'eslint.config.*') }}-
      - run: npx eslint . --cache --cache-strategy content --cache-location node_modules/.cache/eslint/

  format:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/prettier
          key: prettier-${{ hashFiles('package-lock.json', '.prettierrc*') }}-${{ github.sha }}
          restore-keys: prettier-${{ hashFiles('package-lock.json', '.prettierrc*') }}-
      - run: npx prettier --check --cache --cache-strategy content --cache-location node_modules/.cache/prettier/.cache .

  types:
    name: Types · boundaries · audit · SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (server + client + desktop)
        run: npm run typecheck
      - name: Module boundaries (cycles, kit stays presentational; known violations may only shrink)
        run: npm run deps:check
      - name: Validate SQL schema
        run: node scripts/validate-sql.mjs
      # Blocking since SPO-131 (prod dependencies are at 0 high/critical). A new vulnerable package fails the build.
      - name: Dependency audit (production, high and above)
        run: npm audit --omit=dev --audit-level=high

  tests:
    name: Unit tests + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the Coach server tests import the Cloud Functions sources, which have their own lockfile
      - run: npm ci --prefix functions
      - name: Unit tests + coverage gate
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: client/coverage
          if-no-files-found: ignore

  build:
    name: Build (server + client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w server && npm run build -w client

  # Static security analysis (replaces CodeQL, which needs a paid licence on private repos). Findings become annotations.
  security:
    name: Security (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install semgrep==1.181.0
      - name: Scan client and functions
        run: semgrep scan --config p/javascript --config p/typescript --config p/react --config p/secrets --metrics=off --json --output semgrep.json client/src functions/src scripts || true
      - name: Report findings
        run: node scripts/semgrep-annotate.mjs semgrep.json

  quality:
    name: Lint · types · tests · build
    if: always()
    needs: [lint, format, types, tests, build, security]
    runs-on: ubuntu-latest
    steps:
      - name: Every quality job must have succeeded (a skipped or cancelled one counts as a failure)
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then exit 1; fi

  smoke:
    name: API smoke (real server + SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w server
      - name: Boot server on a throwaway DB and run the contract smoke
        run: |
          export GYM_DATA_DIR="$(mktemp -d)"
          PORT=4499 node server/dist/index.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4499/api/health >/dev/null && break
            sleep 0.5
          done
          BASE=http://localhost:4499 node scripts/smoke.mjs

  # ---- layout audit: build Storybook once, audit it in parallel shards, then prove nothing was skipped ----
  storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - id: shards
        run: echo "list=$(node -e 'console.log(JSON.stringify([...Array(Number(process.env.LAYOUT_SHARDS)).keys()]))')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: client/storybook-static
          retention-days: 1
          compression-level: 1

  layout-shard:
    name: Layout shard ${{ matrix.shard }}
    needs: storybook
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.storybook.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: client/storybook-static
      - name: Serve the built Storybook
        run: |
          npx --yes http-server client/storybook-static -p 6006 -s >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:6006/index.json >/dev/null && break; sleep 1; done
          mkdir -p audit-reports
      - name: Story audit (no sideways scroll, no clipped text or shadow; 320 / 390, normal and large font)
        run: npm run audit:stories -- --url http://127.0.0.1:6006 --locales ${{ env.LAYOUT_LOCALES }} --widths 320,390 --fonts 1,1.5 --part ${{ matrix.shard }}/${{ env.LAYOUT_SHARDS }} --concurrency 5 --out audit-reports/stories-${{ matrix.shard }}.json
      - name: Page hero / top bar spacing (back, title, actions on one axis; 390-1920)
        if: always()
        run: npm run audit:hero -- --url http://127.0.0.1:6006 --part ${{ matrix.shard }}/${{ env.LAYOUT_SHARDS }} --concurrency 5 --out audit-reports/hero-${{ matrix.shard }}.json
      - name: Chat frame geometry (trainer / client / Atlas; 320-1920)
        if: always()
        run: npm run audit:chat -- --url http://127.0.0.1:6006 --locales ${{ env.LAYOUT_LOCALES }} --part ${{ matrix.shard }}/${{ env.LAYOUT_SHARDS }} --concurrency 5 --out audit-reports/chat-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report-${{ matrix.shard }}
          path: audit-reports
          if-no-files-found: error

  layout:
    name: Layout audit (Storybook geometry)
    if: always()
    needs: [storybook, layout-shard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: audit-report-*
          merge-multiple: true
          path: audit-reports
      - name: Shards must add up to the whole matrix, every probe run, no findings
        run: |
          if [ "${{ needs.storybook.result }}" != "success" ]; then echo "Storybook build: ${{ needs.storybook.result }}"; exit 1; fi
          node scripts/audit-merge.mjs audit-reports --shards "$LAYOUT_SHARDS"
