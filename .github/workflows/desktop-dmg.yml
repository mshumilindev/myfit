name: Desktop DMG (unsigned)

# Manual only: builds an unsigned macOS DMG of the Electron shell and attaches it as a run artifact.
on:
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci -w desktop --ignore-scripts
      - name: Build DMG
        shell: bash
        run: |
          set -o pipefail
          if ! npm run dmg -w desktop 2>&1 | tee dmg.log; then
            # Logs of failed runs are not always reachable (API/proxy), so surface the tail as an annotation.
            tail -n 25 dmg.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > dmg.tail
            echo "::error title=DMG build failed::$(cat dmg.tail)"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: spotter-dmg
          path: desktop/release/*.dmg
          if-no-files-found: error
